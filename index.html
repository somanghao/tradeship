<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아홉 바다 교역기</title>
<!-- 돛 하나. 아이콘이 없으면 브라우저가 제 발로 /favicon.ico를 불러 404를 받고,
     그러면 **콘솔 오류를 세는 모든 검증이 이것 하나로 실패한다**(실클릭 TC-01이 그랬다).
     외부 파일을 두지 않으려고 SVG를 그대로 박는다 — 픽셀 눈금에 맞춘 삼각돛과 선체다. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231b2733'/%3E%3Cpath d='M8 2h1v8H8z' fill='%23c8b892'/%3E%3Cpath d='M7 3H4l3 5z' fill='%23e8e2d0'/%3E%3Cpath d='M10 4h3l-3 4z' fill='%23d8cfb8'/%3E%3Cpath d='M2 11h12l-2 3H4z' fill='%238a6a44'/%3E%3Cpath d='M1 14h14v1H1z' fill='%233a6b8a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- 상단 상태바 -->
  <header id="hud">
    <div class="hud-brand">아홉 바다 교역기</div>
    <div class="hud-stats">
      <span class="stat" id="hud-day"   title="경과 일수"><i>📅</i><b>1</b>일차</span>
      <span class="stat gold" id="hud-gold" title="보유 금화"><i>🪙</i><b>0</b></span>
      <span class="stat" id="hud-ship"  title="선박"><i>⛵</i><b>카라벨</b></span>
      <span class="stat" id="hud-hull"  title="선체"><i>🛠</i><b>0/0</b></span>
      <span class="stat" id="hud-crew"  title="선원"><i>⚓</i><b>0/0</b></span>
      <span class="stat" id="hud-guns"  title="대포"><i>💥</i><b>0</b>문</span>
      <span class="stat" id="hud-cargo" title="적재"><i>📦</i><b>0/0</b></span>
    </div>
  </header>

  <!-- 게임 화면 -->
  <div id="stage">
    <canvas id="screen"></canvas>
    <div id="overlay"></div>
    <div id="toast"></div>
  </div>

  <!-- 항해일지 -->
  <footer id="logbar">
    <span class="log-label">항해일지</span>
    <div id="log-line">—</div>
    <button id="log-toggle" class="mini">전체</button>
  </footer>

</div>

<!-- 전체 일지 -->
<div id="logmodal" class="modal hidden">
  <div class="modal-box">
    <h3>항해일지</h3>
    <div id="logfull"></div>
    <button class="btn" data-close-log>닫기</button>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
